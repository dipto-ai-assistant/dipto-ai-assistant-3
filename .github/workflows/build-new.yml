
name: Build DIPTO AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-new.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/DIPTO_AI_CALL_ASSISTANT
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIPTO-AI-APK
          path: source/DIPTO_AI_CALL_ASSISTANT/app/build/outputs/apk/debug/*.apk
