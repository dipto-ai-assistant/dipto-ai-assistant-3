
name: Build DIPTO AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-new.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'DIPTO_AI_CALL_ASSISTANT_SOURCE*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found!"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Locate Android Project
        id: project
        run: |
          SETTINGS_FILE=$(find source -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIPTO-AI-CALL-ASSISTANT-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 
