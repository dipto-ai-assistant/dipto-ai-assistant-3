
name: DIPTO AI APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: unzip -o dipto-ai-assistant-2-ui-fixed.zip -d extracted
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd extracted/dipto-ai-assistant-2/android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIPTO-AI-APK
          path: extracted/dipto-ai-assistant-2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
